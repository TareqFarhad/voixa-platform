[project]
name = "voixa-worker"
version = "0.1.0"
description = "Voixa AI vocal processing worker"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "redis>=5.0.7",
  "requests>=2.32.3",
  "numpy>=1.26.4",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "pydub>=0.25.1"
]

[project.scripts]
voixa-worker = "voixa_worker.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
