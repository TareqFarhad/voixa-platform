name: Deploy Voixa landing to GitHub Pages

# Builds the Voixa Next.js frontend in static export mode and publishes it
# to GitHub Pages whenever main is updated. The full Voixa experience needs
# the Node.js API, Postgres, Redis, and Python worker - those are not part
# of the static deployment. The page hosted on GitHub Pages is the premium
# marketing landing plus the auth and profile shells.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Compute base path
        id: base
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "basepath=/${REPO_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Next.js static export
        env:
          NEXT_PUBLIC_STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.basepath }}
          NEXT_PUBLIC_API_URL: ''
        run: pnpm --filter @voixa/web build

      - name: Add Jekyll bypass marker
        run: touch apps/web/out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
